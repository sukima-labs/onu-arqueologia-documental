name: Publicar en GitHub Pages
# Alternativa a «Deploy from a branch». Solo manual: úsalo únicamente si en Settings → Pages eliges Source: GitHub Actions.
on:
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v7
      - name: Armar el sitio (solo lo necesario)
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/atlas-data.js data/catalogo.json data/atlas-onu-catalogo-v07.xlsx _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
