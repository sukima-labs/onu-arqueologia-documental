name: Pruebas
on:
  push: { branches: [main] }   # en las demás ramas ya corre por su PR; así un force-push no lanza decenas de ejecuciones
  pull_request: {}
jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tests && node smoke.cjs
      - run: npm i --no-save playwright@1.64.1 && npx playwright install --with-deps chromium && node tests/browser.cjs
